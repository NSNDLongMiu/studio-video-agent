# Cấu hình Codex riêng cho dự án này. Codex chỉ nạp file này khi dự án được "tin cậy"
# (lần đầu mở Codex trong thư mục này nó sẽ hỏi). Lệnh `studio produce` còn tự truyền
# cùng cấu hình MCP bằng -c nên chạy được kể cả khi chưa tin cậy.

# Sổ sách xưởng: Codex ở vai "agent" => KHÔNG có công cụ duyệt / mở-đóng phòng / đổi chỉ tiêu.
[mcp_servers.studio]
command = "node"
args = ["--disable-warning=ExperimentalWarning", "d:/Agent Video Studio/studio/src/mcp.mjs"]
env = { STUDIO_ROLE = "agent" }
startup_timeout_sec = 30

[mcp_servers.studio.tools.list_jobs]
approval_mode = "approve"

[mcp_servers.studio.tools.list_videos]
approval_mode = "approve"

[mcp_servers.studio.tools.report_status]
approval_mode = "approve"
